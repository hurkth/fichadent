<!DOCTYPE html>
<html lang="es"><head>
<!-- Referencia de diseño extraída de GOLDENT___App_clinica.html. Plantilla con bindings {{...}} y lógica de ejemplo en <script type="text/x-dc">. Para verla renderizada, abrir el HTML original. -->
<meta charset="utf-8">
<title>GOLDENT · Nuevo paciente</title>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.g,.g *{box-sizing:border-box}
.g{font-family:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;color:#111111;-webkit-font-smoothing:antialiased}
.g button,.g input{font-family:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 22px;border-radius:14px;font-size:16px;font-weight:700;border:1.5px solid transparent;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn-p{background:#8A6512;color:#FFFFFF}
.btn-s{background:#FFFFFF;color:#111111;border-color:#D9D4CB}
.btn-lg{min-height:64px;font-size:18px;border-radius:16px;padding:0 28px}
.card{background:#FFFFFF;border:1px solid #E8E5DF;border-radius:20px}
.lbl{display:block;font-size:13px;font-weight:700;color:#5B5B5F;letter-spacing:.04em;text-transform:uppercase}
.inp{display:block;width:100%;height:56px;border:1.5px solid #D9D4CB;border-radius:14px;padding:0 16px;font-size:17px;font-weight:600;background:#FFFFFF;color:#111111}
.inp::placeholder{color:#76767C;font-weight:500}
.ico{width:22px;height:22px;flex:none}
.muted{color:#5B5B5F}
.nav{width:84px;height:72px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:12px;font-weight:700;text-decoration:none;color:#5B5B5F}
.nav-on{background:#FBF5E8;color:#6B4E0E}
</style>
</helmet>
<div class="g" style="width:1194px;height:1860px;display:flex;background:#F7F6F3;overflow:hidden">

<nav aria-label="Principal" style="width:104px;flex:none;background:#FFFFFF;border-right:1px solid #E8E5DF;display:flex;flex-direction:column;align-items:center;padding:20px 0;gap:8px">
<a href="Inicio.dc.html" aria-label="GOLDENT, ir al inicio" style="display:flex;width:56px;height:56px;align-items:center;justify-content:center;margin-bottom:12px"><svg width="48" height="48" sc-camel-view-box="0 0 48 48" aria-hidden="true"><path d="M24 1.5 46.5 24 24 46.5 1.5 24Z" fill="#E8A6C4"></path><path d="M24 1.5 33 24 24 46.5 15 24Z" fill="#F1C3D7"></path><path d="M16.5 17.6c0-3 2.8-4.3 7.5-3.3 4.7-1 7.5.3 7.5 3.3 0 3.8-1.6 5.6-2.1 9.2-.4 3-1 5.3-2.4 5.3-1.6 0-1.6-4.8-3-4.8s-1.4 4.8-3 4.8c-1.4 0-2-2.3-2.4-5.3-.5-3.6-2.1-5.4-2.1-9.2Z" fill="#C9962B" stroke="#8A6512" stroke-width=".9"></path></svg></a>
<a class="nav nav-on" href="Inicio.dc.html" aria-current="page"><svg class="ico" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="4"></circle><path d="M2 21a7 7 0 0 1 14 0M16 4a4 4 0 0 1 0 8M22 21a7 7 0 0 0-4-6.3"></path></svg><span>Pacientes</span></a>
<a class="nav" href="AgendaSemana.dc.html"><svg class="ico" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg><span>Agenda</span></a>
<a class="nav" href="CapturaRapida.dc.html"><svg class="ico" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4Z"></path><circle cx="12" cy="13" r="3.5"></circle></svg><span>Captura</span></a>
</nav>

<main style="flex:1;min-width:0;display:flex;flex-direction:column">
<header style="background:#FFFFFF;border-bottom:1px solid #E8E5DF;padding:18px 32px;display:flex;align-items:center;gap:12px">
<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
<h1 style="margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em">Nuevo paciente</h1>
<span class="muted" style="font-size:14px;font-weight:600">HC 00252 · se asigna automáticamente</span>
</div>
<a class="btn btn-s" href="Inicio.dc.html">Cancelar</a>
<a class="btn btn-p" href="Ficha.dc.html"><svg class="ico" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg>Guardar paciente</a>
</header>

<div style="padding:24px 32px 32px;display:flex;flex-direction:column;gap:20px">
<section class="card" style="padding:24px 26px;display:flex;flex-direction:column;gap:20px">
<h2 style="margin:0;font-size:20px;font-weight:800">Datos personales</h2>
<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 16px">
<label style="display:flex;flex-direction:column;gap:8px"><span class="lbl">Nombres *</span><input class="inp" value="Milagros" autocapitalize="words"></label>
<label style="display:flex;flex-direction:column;gap:8px"><span class="lbl">Apellidos *</span><input class="inp" value="Ccori Huanca" autocapitalize="words"></label>
<label style="display:flex;flex-direction:column;gap:8px"><span class="lbl">DNI *</span><input class="inp" inputmode="numeric" value="47205318" style="font-variant-numeric:tabular-nums"></label>
<label style="display:flex;flex-direction:column;gap:8px"><span class="lbl">Fecha de nacimiento</span>
<span style="display:flex;align-items:center;height:56px;border:1.5px solid #D9D4CB;border-radius:14px;background:#FFFFFF;padding:0 8px 0 16px;gap:8px"><input aria-label="Fecha de nacimiento" inputmode="numeric" value="09/11/1992" style="flex:1;min-width:0;border:0;outline:0;height:100%;font-size:17px;font-weight:600;background:transparent;color:#111111;font-variant-numeric:tabular-nums"><span style="min-height:36px;display:flex;align-items:center;padding:0 12px;border-radius:10px;background:#F1EEE8;font-size:14px;font-weight:700;color:#5B5B5F">33 años</span></span></label>
<label style="display:flex;flex-direction:column;gap:8px"><span class="lbl">Celular *</span>
<span style="display:flex;align-items:center;height:56px;border:1.5px solid #D9D4CB;border-radius:14px;background:#FFFFFF;overflow:hidden"><span style="height:100%;display:flex;align-items:center;padding:0 14px;background:#F7F6F3;border-right:1.5px solid #D9D4CB;font-weight:700;color:#5B5B5F">+51</span><input aria-label="Celular" inputmode="tel" value="965 418 203" style="flex:1;min-width:0;border:0;outline:0;height:100%;padding:0 14px;font-size:17px;font-weight:600;background:transparent;color:#111111;font-variant-numeric:tabular-nums"></span></label>
<label style="display:flex;flex-direction:column;gap:8px"><span class="lbl">Correo · opcional</span><input class="inp" type="email" placeholder="nombre@gmail.com"></label>
<label style="display:flex;flex-direction:column;gap:8px;grid-column:1 / -1"><span class="lbl">Domicilio</span><input class="inp" value="Urb. Los Pinos D-12, Cerro Colorado, Arequipa"></label>
<label style="display:flex;flex-direction:column;gap:8px;grid-column:1 / -1"><span class="lbl">Ocupación</span><input class="inp" value="Docente"></label>
</div>
<div style="display:flex;flex-direction:column;gap:10px">
<span class="lbl">Estado civil</span>
<div role="radiogroup" aria-label="Estado civil" style="display:flex;flex-wrap:wrap;gap:10px">
<sc-for list="{{civiles}}" as="c" hint-placeholder-count="5">
<button type="button" role="radio" aria-checked="{{c.aria}}" sc-camel-on-click="{{c.pick}}" style="display:inline-flex;align-items:center;gap:8px;min-height:52px;padding:0 20px;border-radius:999px;border:1.5px solid {{c.bd}};background:{{c.bg}};color:{{c.fg}};font-size:16px;font-weight:{{c.fw}};cursor:pointer">{{c.l}}</button>
</sc-for>
</div>
</div>
</section>

<section class="card" style="padding:24px 26px 12px;display:flex;flex-direction:column;gap:6px">
<div style="display:flex;align-items:flex-end;gap:12px;padding-bottom:12px">
<div style="flex:1;display:flex;flex-direction:column;gap:4px">
<h2 style="margin:0;font-size:20px;font-weight:800">Antecedentes médicos</h2>
<p class="muted" style="margin:0;font-size:15px;font-weight:500">Activa solo lo que aplique. Lo marcado con “Sí” aparece como alerta en la ficha.</p>
</div>
<span style="display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 12px;border-radius:999px;background:#FDECEA;border:1px solid #F2B8B2;color:#A3201A;font-size:13px;font-weight:700">{{nAlertas}}</span>
</div>
<sc-for list="{{ants}}" as="a" hint-placeholder-count="9">
<div style="border-top:1px solid #EFECE6;padding:8px 0;display:flex;flex-direction:column;gap:8px">
<div style="display:flex;align-items:center;gap:16px;min-height:56px">
<span style="flex:1;font-size:17px;font-weight:700">{{a.l}}</span>
<span style="font-size:15px;font-weight:800;color:{{a.sc}};width:24px;text-align:right">{{a.st}}</span>
<button type="button" role="switch" aria-checked="{{a.aria}}" aria-label="{{a.l}}" sc-camel-on-click="{{a.toggle}}" style="width:68px;height:40px;border-radius:20px;border:0;padding:4px;display:flex;cursor:pointer;justify-content:{{a.jc}};background:{{a.track}}"><span style="width:32px;height:32px;border-radius:50%;background:#FFFFFF;box-shadow:0 1px 3px rgba(0,0,0,.25)"></span></button>
</div>
<sc-if value="{{a.on}}" hint-placeholder-val="{{ false }}">
<input class="inp" aria-label="Detalle: {{a.l}}" placeholder="{{a.ph}}" value="{{a.d}}" sc-camel-on-change="{{a.edit}}" style="margin-bottom:6px">
</sc-if>
</div>
</sc-for>
</section>

<div style="display:flex;gap:14px;justify-content:flex-end">
<a class="btn btn-s btn-lg" href="Inicio.dc.html">Cancelar</a>
<a class="btn btn-p btn-lg" href="Ficha.dc.html" style="min-width:320px"><svg class="ico" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg>Guardar paciente</a>
</div>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:1194,&quot;height&quot;:1860}}">
const ANT = [
  { k: 'alergias', l: 'Alergias', ph: '¿A qué? Ej. penicilina, látex, anestesia' },
  { k: 'diabetes', l: 'Diabetes', ph: 'Tipo y tratamiento' },
  { k: 'hemorragias', l: 'Hemorragias', ph: 'Ej. sangrado prolongado tras extracción' },
  { k: 'presion', l: 'Presión alta / baja', ph: 'Alta o baja, ¿controlada?' },
  { k: 'ulcera', l: 'Úlcera gástrica', ph: 'Detalle' },
  { k: 'cardiaca', l: 'Enfermedad cardiaca', ph: 'Ej. arritmia, marcapasos' },
  { k: 'medicamento', l: 'Recibe medicamento', ph: '¿Cuál y dosis?' },
  { k: 'otra', l: 'Otra enfermedad', ph: '¿Cuál?' },
  { k: 'embarazo', l: 'Embarazo', ph: 'Semanas de gestación' }
];
const CIVIL = ['Soltero(a)', 'Casado(a)', 'Conviviente', 'Divorciado(a)', 'Viudo(a)'];
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      civil: 'Conviviente',
      on: { alergias: true, medicamento: true, embarazo: true },
      det: { alergias: 'Ibuprofeno: ronchas en la piel', medicamento: 'Ácido fólico, sulfato ferroso', embarazo: '12 semanas' }
    };
  }
  renderVals() {
    const s = this.state;
    const n = ANT.filter((a) => s.on[a.k]).length;
    return {
      nAlertas: n === 1 ? '1 alerta' : n + ' alertas',
      civiles: CIVIL.map((l) => {
        const on = s.civil === l;
        return { l, aria: on ? 'true' : 'false', pick: () => this.setState({ civil: l }), bd: on ? '#8A6512' : '#D9D4CB', bg: on ? '#FBF5E8' : '#FFFFFF', fg: on ? '#6B4E0E' : '#111111', fw: on ? '800' : '600' };
      }),
      ants: ANT.map((a) => {
        const on = !!s.on[a.k];
        return {
          l: a.l, ph: a.ph, on, d: s.det[a.k] || '',
          aria: on ? 'true' : 'false', st: on ? 'Sí' : 'No', sc: on ? '#A3201A' : '#5B5B5F',
          jc: on ? 'flex-end' : 'flex-start', track: on ? '#8A6512' : '#CFCAC1',
          toggle: () => this.setState({ on: Object.assign({}, s.on, { [a.k]: !on }) }),
          edit: (e) => this.setState({ det: Object.assign({}, this.state.det, { [a.k]: e.target.value }) })
        };
      })
    };
  }
}
</script>


</body></html>
